aid: ddd-invoices
name: DDD Invoices
description: >-
  DDD Invoices is a unified e-invoicing, fiscalization, and real-time tax
  reporting compliance platform delivered as a single API. It lets software
  companies, ERPs, SaaS platforms, e-commerce systems, marketplaces, payment
  providers, and POS vendors issue, receive, and archive locally compliant
  invoices across 30+ countries without building country-specific tax
  integrations. The platform handles B2B and B2G e-invoicing over the PEPPOL
  network, national real-time reporting and fiscalization mandates, AI-assisted
  invoice document processing, and long-term compliant archival, exposing it all
  through one JSON API with test and production connection keys. Backed by 500
  Global, it raised a USD 1.3M seed round.
